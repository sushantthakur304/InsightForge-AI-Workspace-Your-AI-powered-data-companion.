[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
linkColor = "#4F46E5"
codeTextColor = "#0f172a"
codeBackgroundColor = "#F3F4F6"
borderColor = "#E5E7EB"
dataframeBorderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F9FAFB"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["36px", "27px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 800
linkUnderline = false
redColor = "#dc2626"
orangeColor = "#d97706"
yellowColor = "#ca8a04"
greenColor = "#15803D"
blueColor = "#4F46E5"
violetColor = "#6D28D9"
grayColor = "#6B7280"
chartCategoricalColors = ["#4F46E5", "#0891B2", "#15803D", "#D97706", "#6D28D9", "#DC2626", "#475569", "#0F766E"]
chartSequentialColors = ["#EEF2FF", "#E0E7FF", "#C7D2FE", "#A5B4FC", "#818CF8", "#6366F1", "#4F46E5", "#4338CA", "#3730A3", "#312E81"]

[theme.sidebar]
primaryColor = "#4F46E5"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e8ef"
codeBackgroundColor = "#f0f3f8"
