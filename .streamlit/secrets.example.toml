INSIGHTFORGE_MAX_UPLOAD_MB = "100"
INSIGHTFORGE_MASK_SENSITIVE_PREVIEWS = "true"
INSIGHTFORGE_AI_PROVIDER = "rule_based"
OPENAI_API_KEY = ""
OPENAI_MODEL = "gpt-4.1-mini"

# Optional local/server disk storage paths.
# For public multi-user deployments, use external object/database storage for durable saved datasets.
INSIGHTFORGE_STORAGE_DB = "data/insightforge_storage.sqlite3"
INSIGHTFORGE_STORAGE_DIR = "data/datasets"

# Production-only Supabase storage. Never commit real keys.
# INSIGHTFORGE_STORAGE_BACKEND = "supabase"
# SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY = "server-only-service-role-key"
# INSIGHTFORGE_SUPABASE_BUCKET = "dataset-files"
# INSIGHTFORGE_BACKGROUND_FILE_THRESHOLD_MB = "25"

# Streamlit uses an OIDC provider for verified sign-in when Supabase storage is enabled.
# Register the callback URL with the provider, then set the matching values here.
# [auth]
# redirect_uri = "https://your-app.example.com/oauth2callback"
# cookie_secret = "long-random-secret"
#
# [auth.google]
# client_id = "google-client-id"
# client_secret = "google-client-secret"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Optional Power BI Embedded configuration.
# Keep these values server-side in Streamlit secrets or environment variables.
# Do not use Publish to web for private uploaded data.
POWERBI_TENANT_ID = ""
POWERBI_CLIENT_ID = ""
POWERBI_CLIENT_SECRET = ""
POWERBI_WORKSPACE_ID = ""
POWERBI_REPORT_ID = ""
POWERBI_DATASET_ID = ""
POWERBI_RLS_USERNAME = ""
POWERBI_RLS_ROLES = ""
POWERBI_TOKEN_LIFETIME_MINUTES = "45"
